version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: markethub-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub123
      POSTGRES_DB: markethub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markethub']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: markethub-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: markethub
      RABBITMQ_DEFAULT_PASS: markethub123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: markethub-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://markethub:markethub123@postgres:5432/markethub
      RABBITMQ_URL: amqp://markethub:markethub123@rabbitmq:5672
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    container_name: markethub-aggregator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://markethub:markethub123@postgres:5432/markethub
      RABBITMQ_URL: amqp://markethub:markethub123@rabbitmq:5672
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
