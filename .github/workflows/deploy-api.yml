name: Deploy markethub-api

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/core/**'
      - 'services/emitter-spedy/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f services/api/Dockerfile \
            -t markethub-api:latest \
            .

      - name: Export image
        run: docker save markethub-api:latest | gzip > markethub-api.img

      - name: Copy image to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: markethub-api.img
          target: /tmp/

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          script: |
            docker load < /tmp/markethub-api.img
            docker stop markethub-api || true
            docker rm markethub-api || true
            docker run -d \
              --name markethub-api \
              --network markethub_default \
              --network-alias api \
              -p 4000:4000 \
              --env-file /home/${{ secrets.VM_USER }}/.env.markethub \
              --restart unless-stopped \
              markethub-api:latest
            rm /tmp/markethub-api.img
