name: Deploy markethub-api

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/core/**'
      - 'services/emitter-spedy/**'
      - '.github/workflows/deploy-api.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/markethub-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Deploy na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker network create markethub_default 2>/dev/null || true
            docker pull $IMAGE:latest
            docker stop markethub-api || true
            docker rm markethub-api || true
            docker run -d \
              --name markethub-api \
              --network markethub_default \
              --network-alias api \
              -p 4000:4000 \
              --env-file /home/${{ secrets.VM_USER }}/.env.markethub \
              --restart unless-stopped \
              $IMAGE:latest
