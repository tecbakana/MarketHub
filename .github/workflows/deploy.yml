name: Deploy — MarketHub

on:
  push:
    branches: [main]

jobs:
  # ── Detecta quais serviços foram alterados ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      aggregator: ${{ steps.filter.outputs.aggregator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/**'
            aggregator:
              - 'services/aggregator/**'
              - 'packages/**'

  # ── Deploy seletivo via SSH ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.aggregator == 'true'
    steps:
      - name: Deploy serviços alterados
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/MarketHub
            git pull

            if [ "${{ needs.changes.outputs.api }}" == "true" ]; then
              echo ">>> Rebuilding api..."
              docker compose build api
              docker compose up -d api
            fi

            if [ "${{ needs.changes.outputs.aggregator }}" == "true" ]; then
              echo ">>> Rebuilding aggregator..."
              docker compose build aggregator
              docker compose up -d aggregator
            fi
