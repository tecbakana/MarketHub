name: Deploy markethub-aggregator

on:
  push:
    branches: [main]
    paths:
      - 'services/aggregator/**'
      - 'services/connector-mercadolivre/**'
      - 'services/emitter-spedy/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-aggregator.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/markethub-aggregator

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/aggregator/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Deploy na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:latest
            docker stop markethub-aggregator || true
            docker rm markethub-aggregator || true
            docker run -d \
              --name markethub-aggregator \
              --network markethub_default \
              --network-alias aggregator \
              --env-file /home/${{ secrets.VM_USER }}/.env.markethub \
              --restart unless-stopped \
              ${{ env.IMAGE }}:latest
